# CI: compila la sample con twister en cada push y pull request.
# Corre en el mirror de GitHub (Codeberg empuja ahí cada push).
# Basado en .github/workflows/build.yml de zephyrproject-rtos/example-application,
# reducido a Ubuntu.
name: Build

# En todas las ramas: el mirror las copia todas y los PR viven en Codeberg,
# así que esta es la única CI que ve una rama antes de fusionarla.
# paths-ignore: un push que solo toca .md no compila (si toca código también,
# se ejecuta igual). workflow_dispatch: botón "Run workflow" para lanzarla a mano.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# El job solo necesita leer el repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Las acciones van fijadas por SHA, como en upstream: un tag se puede
      # mover, un SHA no.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El checkout va a una subcarpeta: el topdir de west es la carpeta
          # de arriba, donde west update deja zephyr/ y modules/.
          path: zephyr-si7021-module
          persist-credentials: false

      # El mismo Python que fija nix/shell.nix en local.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      # west init -l + west update con west.yml, y el Zephyr SDK solo con el
      # toolchain de Cortex-M.
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephyr-si7021-module
          toolchains: arm-zephyr-eabi

      # --integration: solo las integration_platforms de sample.yaml.
      - name: Build sample
        working-directory: zephyr-si7021-module
        run: west twister -T samples -v --inline-logs --integration
